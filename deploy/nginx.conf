# Пример для nginx: игра на 80-м порту, Node.js слушает 8080.
# Скопируйте в /etc/nginx/sites-available/predely и включите ссылкой в sites-enabled.
server {
    listen 80;
    server_name _;            # замените на домен, если он есть

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;   # сервер держит запрос до 25 с, пока ждёт ход соперника
    }
}
